[project]
name = "customer-support-agent"
version = "0.2.0"
description = "AmericanAir intent classification and support-agent research (Hiver take-home)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core data / ML
    "torch>=2.4.0",
    "faiss-cpu>=1.13.0",
    "hdbscan>=0.8.41",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=3.4.0",
    "umap-learn>=0.5.11",
    # Local LLM / embedding backends used by the notebooks (Ollama)
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    # Apps
    "streamlit>=1.45.0",
    "rich>=13.0.0",
    # Notebooks
    "ipykernel>=7.3.0",
    "setfit>=1.2.0",
    "langgraph>=1.2.11",
    "ragas>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # sys.path shim before package imports
"run_submission.py" = ["E402"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
